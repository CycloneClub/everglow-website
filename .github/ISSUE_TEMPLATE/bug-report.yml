name: Bug report
description: Report a reproducible problem with the Everglow website.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Please do not use this form for security vulnerabilities.
  - type: input
    id: page-url
    attributes:
      label: Affected page URL
      description: Paste the full URL where the problem occurs.
      placeholder: https://example.com/docs/...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and operating system
      placeholder: Windows 11, Android 15, macOS 15, etc.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console output
      description: Drag in screenshots or paste any relevant browser-console errors. Please remove sensitive information.
