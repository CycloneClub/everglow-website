name: Build and Test
run-name: ${{ github.actor }} is validating the production build

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION: 22.18.0
  BASE_URL: ${{ vars.BASE_URL }}
  COLOR_MODE_STORAGE_KEY: ${{ vars.COLOR_MODE_STORAGE_KEY }}
  LANGUAGE_STORAGE_KEY: ${{ vars.LANGUAGE_STORAGE_KEY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Pnpm Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Start and test production server
        shell: bash
        run: |
          set -euo pipefail

          node .output/server/index.mjs &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Server exited before becoming ready."
              wait "$server_pid"
              exit 1
            fi

            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "Production server responded successfully."
              exit 0
            fi

            sleep 1
          done

          echo "Server did not become ready within 30 seconds."
          exit 1
