name: Build and Test
run-name: ${{ github.actor }} is validating the production build

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4
  BASE_URL: ${{ vars.BASE_URL }}
  COLOR_MODE_STORAGE_KEY: ${{ vars.COLOR_MODE_STORAGE_KEY }}
  LANGUAGE_STORAGE_KEY: ${{ vars.LANGUAGE_STORAGE_KEY }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Test SEO dates and IndexNow
        run: node --test scripts/test-seo-metadata.mjs scripts/test-indexnow.mjs

      - name: Build
        run: pnpm build

      - name: Start and test production server
        run: node scripts/smoke-test.mjs
