name: Deploy to Server
run-name: ${{ github.actor }} is deploying a new version to the development server

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/deploy-to-server.yml'
      - '!.vscode/**'
      - '!.env.example'
      - '!.gitattributes'
      - '!.gitignore'
      - '!.prettierrc.json'
      - '!README.md'
      - '!TODO.md'

permissions:
  contents: read

concurrency:
  group: deploy-development-server
  cancel-in-progress: true

env:
  NODE_VERSION: 22.18.0
  BASE_URL: ${{ vars.BASE_URL }}
  COLOR_MODE_STORAGE_KEY: ${{ vars.COLOR_MODE_STORAGE_KEY }}
  LANGUAGE_STORAGE_KEY: ${{ vars.LANGUAGE_STORAGE_KEY }}

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml

  build-and-deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v1
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true

      - name: Build
        run: pnpm build

      - name: Verify restart command
        env:
          RESTART_COMMAND: ${{ vars.RESTART_COMMAND }}
        run: |
          if [ -z "$RESTART_COMMAND" ]; then
            echo "::error::RESTART_COMMAND is not configured in the github-pages environment"
            exit 1
          fi

      - name: Deploy
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.ACCESS_TOKEN }}
          ARGS: '-avz --delete'
          SOURCE: '.output/'
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET }}

      - name: Restart server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.ACCESS_TOKEN }}
          script: |
            set -e
            ${{ vars.RESTART_COMMAND }}
